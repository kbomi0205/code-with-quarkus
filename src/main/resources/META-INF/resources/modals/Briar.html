<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>브라이어 상세</title>

<link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">

<style>
body { background-color:#0a0e17; color:white; padding:1.5rem; font-family:'Segoe UI'; }
h3,h4 { color:#c8aa6e; }
.text-muted { color:#a0a0a0 !important; }
.list-group-item { background:transparent; border-color:#444; color:white; }
</style>
</head>
<body>

<div class="container-fluid">
<div class="row g-4">

<div class="col-lg-5 text-center">
<img src="../image/briar.jpg" class="img-fluid rounded shadow-lg" alt="브라이어" style="max-height:480px;">
<div class="mt-3">
<h3 class="mb-1">브라이어 (Briar)</h3>
<p class="text-muted fs-5">전사 / 난이도: 중</p>
</div>
</div>

<div class="col-lg-7">
<h4 class="border-bottom border-secondary pb-2 mb-3">스킬</h4>
<ul class="list-group list-group-flush mb-4">
<li class="list-group-item">패시브: 피의 갈망</li>
<li class="list-group-item">Q: 돌진 공격</li>
<li class="list-group-item">W: 광폭화</li>
<li class="list-group-item">E: 피의 포효</li>
<li class="list-group-item">R: 피의 추적</li>
</ul>

<h4 class="border-bottom border-secondary pb-2 mb-3">배경 스토리 요약</h4>
<p class="text-secondary lh-lg">
브라이어는 피에 굶주린 존재로, 전투에서 이성을 잃고 적을 끝까지 추격한다.
통제 불가능한 광기를 가진 위험한 전사다.
</p>
</div>

</div>
</div>

</body>
</html>
