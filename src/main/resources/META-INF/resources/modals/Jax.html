<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>잭스 상세</title>
  <!-- Bootstrap 5 CSS -->
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
  <!-- LOL 테마 커스텀 스타일 -->
  <style>
    body { background-color: #0a0e17; color: white; padding: 1.5rem; font-family: 'Segoe UI', sans-serif; }
    h3, h4 { color: #c8aa6e; }
    .text-muted { color: #a0a0a0 !important; }
    .list-group-item { background: transparent; border-color: #444; color: white; }
  </style>
</head>
<body>
  <div class="container-fluid">
    <div class="row g-4">

      <!-- 왼쪽: 챔피언 이미지 + 기본 정보 -->
      <div class="col-lg-5 text-center">
        <img src="../image/jax.jpg" class="img-fluid rounded shadow-lg" alt="잭스" style="max-height: 480px; object-fit: contain;">
        <div class="mt-3">
          <h3 class="mb-1">잭스 (Jax)</h3>
          <p class="text-muted fs-5">전사 / 난이도: 하</p>
        </div>
      </div>

      <!-- 오른쪽: 스킬 목록 + 배경 스토리 -->
      <div class="col-lg-7">
        <h4 class="border-bottom border-secondary pb-2 mb-3">스킬</h4>
        <ul class="list-group list-group-flush mb-4">
          <li class="list-group-item">패시브: 무기 숙련</li>
          <li class="list-group-item">Q: 도약 공격</li>
          <li class="list-group-item">W: 강화 공격</li>
          <li class="list-group-item">E: 반격</li>
          <li class="list-group-item">R: 그랜드 마스터의 위엄</li>
        </ul>
        <h4 class="border-bottom border-secondary pb-2 mb-3">배경 스토리 요약</h4>
        <p class="text-secondary lh-lg">
          잭스는 전설적인 전사로, 강한 상대를 찾기 위해 싸운다.
          단순한 가로등조차 무기로 사용하는 강력한 전투 전문가다.
        </p>
      </div>

    </div>
  </div>
</body>
</html>
