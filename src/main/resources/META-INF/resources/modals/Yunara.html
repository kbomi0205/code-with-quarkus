<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>유나라 상세</title>
  <!-- Bootstrap 5 CSS -->
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
  <!-- LOL 테마 커스텀 스타일 -->
  <style>
    body { background-color: #0a0e17; color: white; padding: 1.5rem; font-family: 'Segoe UI', sans-serif; }
    h3, h4 { color: #c8aa6e; }
    .text-muted { color: #a0a0a0 !important; }
    .list-group-item { background: transparent; border-color: #444; color: white; }
  </style>
</head>
<body>
  <div class="container-fluid">
    <div class="row g-4">

      <!-- 왼쪽: 챔피언 이미지 + 기본 정보 -->
      <div class="col-lg-5 text-center">
        <img src="../image/yunara.jpg" class="img-fluid rounded shadow-lg" alt="유나라" style="max-height: 480px; object-fit: contain;">
        <div class="mt-3">
          <h3 class="mb-1">유나라 (Yunara)</h3>
          <p class="text-muted fs-5">원거리 딜러 / 난이도: 중</p>
        </div>
      </div>

      <!-- 오른쪽: 스킬 목록 + 배경 스토리 -->
      <div class="col-lg-7">
        <h4 class="border-bottom border-secondary pb-2 mb-3">스킬</h4>
        <ul class="list-group list-group-flush mb-4">
          <li class="list-group-item">패시브: 집중 사격</li>
          <li class="list-group-item">Q: 관통 화살</li>
          <li class="list-group-item">W: 정밀 조준</li>
          <li class="list-group-item">E: 회피 기동</li>
          <li class="list-group-item">R: 궁극 화살 폭격</li>
        </ul>
        <h4 class="border-bottom border-secondary pb-2 mb-3">배경 스토리 요약</h4>
        <p class="text-secondary lh-lg">
          유나라는 먼 거리에서 적을 제압하는 데 특화된 챔피언이다.
          침착한 판단력과 정밀한 공격으로 전장을 지배하며, 아군의 후방 화력을 책임진다.
        </p>
      </div>

    </div>
  </div>
</body>
</html>
