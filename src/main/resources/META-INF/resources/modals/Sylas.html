<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>사일러스 상세</title>

  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">

  <style>
    body {
      background-color: #0a0e17;
      color: white;
      padding: 1.5rem;
      font-family: 'Segoe UI', sans-serif;
    }
    h3, h4 { color: #c8aa6e; }
    .text-muted { color: #a0a0a0 !important; }
    .list-group-item {
      background: transparent;
      border-color: #444;
      color: white;
    }
  </style>
</head>
<body>

<div class="container-fluid">
<div class="row g-4">

<!-- 왼쪽 -->
<div class="col-lg-5 text-center">
<img src="../image/sylas.jpg" class="img-fluid rounded shadow-lg" alt="사일러스" style="max-height: 480px; object-fit: contain;">
<div class="mt-3">
<h3 class="mb-1">사일러스 (Sylas)</h3>
<p class="text-muted fs-5">마법사 / 난이도: 중</p>
</div>
</div>

<!-- 오른쪽 -->
<div class="col-lg-7">
<h4 class="border-bottom border-secondary pb-2 mb-3">스킬</h4>
<ul class="list-group list-group-flush mb-4">
<li class="list-group-item">패시브: 페트리사이트 폭발</li>
<li class="list-group-item">Q: 사슬 폭발</li>
<li class="list-group-item">W: 국왕시해자</li>
<li class="list-group-item">E: 도주 / 강탈</li>
<li class="list-group-item">R: 강탈</li>
</ul>

<h4 class="border-bottom border-secondary pb-2 mb-3">배경 스토리 요약</h4>
<p class="text-secondary lh-lg">
데마시아의 억압 속에서 자란 사일러스는 금지된 마법의 힘을 흡수하는 반역자다.
그는 자유를 위해 싸우며 적의 힘을 빼앗는다.
</p>
</div>

</div>
</div>

</body>
</html>
