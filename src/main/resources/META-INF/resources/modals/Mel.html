<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>멜 상세</title>

<link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">

<style>
body { background:#0a0e17; color:white; padding:1.5rem; }
h3,h4 { color:#c8aa6e; }
.text-muted { color:#a0a0a0 !important; }
.list-group-item { background:transparent; border-color:#444; color:white; }
</style>
</head>
<body>

<div class="container-fluid">
<div class="row g-4">

<div class="col-lg-5 text-center">
<img src="../image/mel.jpg" class="img-fluid rounded shadow-lg" alt="멜" style="max-height:480px;">
<div class="mt-3">
<h3 class="mb-1">멜 (Mel)</h3>
<p class="text-muted fs-5">마법사 / 난이도: 중</p>
</div>
</div>

<div class="col-lg-7">
<h4 class="border-bottom border-secondary pb-2 mb-3">스킬</h4>
<ul class="list-group list-group-flush mb-4">
<li class="list-group-item">패시브: 마력 축적</li>
<li class="list-group-item">Q: 마법 탄환</li>
<li class="list-group-item">W: 보호막 생성</li>
<li class="list-group-item">E: 마력 폭발</li>
<li class="list-group-item">R: 궁극 마법</li>
</ul>

<h4 class="border-bottom border-secondary pb-2 mb-3">배경 스토리 요약</h4>
<p class="text-secondary lh-lg">
멜은 강력한 마법을 사용하는 캐릭터로, 전투에서 다양한 마법을 활용한다.
균형 잡힌 능력으로 아군을 지원하고 적을 제압한다.
</p>
</div>

</div>
</div>

</body>
</html>
