<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>애니비아 상세</title>

  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">

  <style>
    body { background-color: #0a0e17; color: white; padding: 1.5rem; font-family: 'Segoe UI', sans-serif; }
    h3, h4 { color: #c8aa6e; }
    .text-muted { color: #a0a0a0 !important; }
    .list-group-item { background: transparent; border-color: #444; color: white; }
  </style>
</head>
<body>

<div class="container-fluid">
<div class="row g-4">

<div class="col-lg-5 text-center">
<img src="../image/anivia.jpg" class="img-fluid rounded shadow-lg" alt="애니비아" style="max-height: 480px; object-fit: contain;">
<div class="mt-3">
<h3 class="mb-1">애니비아 (Anivia)</h3>
<p class="text-muted fs-5">마법사 / 난이도: 상</p>
</div>
</div>

<div class="col-lg-7">
<h4 class="border-bottom border-secondary pb-2 mb-3">스킬</h4>
<ul class="list-group list-group-flush mb-4">
<li class="list-group-item">패시브: 환생</li>
<li class="list-group-item">Q: 섬광 폭발</li>
<li class="list-group-item">W: 결정화</li>
<li class="list-group-item">E: 서리 폭풍</li>
<li class="list-group-item">R: 빙하 폭풍</li>
</ul>

<h4 class="border-bottom border-secondary pb-2 mb-3">배경 스토리 요약</h4>
<p class="text-secondary lh-lg">
프렐요드의 수호자 애니비아는 얼음과 바람을 다루는 고대의 존재다.
죽어도 다시 태어나며 북쪽 대지를 지킨다.
</p>
</div>

</div>
</div>

</body>
</html>
