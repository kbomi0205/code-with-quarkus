<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>자헨 상세</title>
  <!-- Bootstrap 5 CSS -->
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
  <!-- LOL 테마 커스텀 스타일 -->
  <style>
    body { background-color: #0a0e17; color: white; padding: 1.5rem; font-family: 'Segoe UI', sans-serif; }
    h3, h4 { color: #c8aa6e; }
    .text-muted { color: #a0a0a0 !important; }
    .list-group-item { background: transparent; border-color: #444; color: white; }
  </style>
</head>
<body>
  <div class="container-fluid">
    <div class="row g-4">

      <!-- 왼쪽: 챔피언 이미지 + 기본 정보 -->
      <div class="col-lg-5 text-center">
        <img src="../image/jahen.jpg" class="img-fluid rounded shadow-lg" alt="자헨" style="max-height: 480px; object-fit: contain;">
        <div class="mt-3">
          <h3 class="mb-1">자헨 (Jahen)</h3>
          <p class="text-muted fs-5">전사 / 난이도: 상</p>
        </div>
      </div>

      <!-- 오른쪽: 스킬 목록 + 배경 스토리 -->
      <div class="col-lg-7">
        <h4 class="border-bottom border-secondary pb-2 mb-3">스킬</h4>
        <ul class="list-group list-group-flush mb-4">
          <li class="list-group-item">패시브: 전투 본능</li>
          <li class="list-group-item">Q: 강철 베기</li>
          <li class="list-group-item">W: 방어 태세</li>
          <li class="list-group-item">E: 돌진 타격</li>
          <li class="list-group-item">R: 종결의 일격</li>
        </ul>
        <h4 class="border-bottom border-secondary pb-2 mb-3">배경 스토리 요약</h4>
        <p class="text-secondary lh-lg">
          자헨은 강력한 힘과 뛰어난 근접 전투 능력을 가진 전사다.
          위험한 전장 한가운데로 뛰어들어 적을 압박하며, 강한 생존력과 공격력을 동시에 보여준다.
        </p>
      </div>

    </div>
  </div>
</body>
</html>
