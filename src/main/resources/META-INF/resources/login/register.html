<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>League of Legends - 회원가입</title>

    <!-- Bootstrap 5 CSS CDN -->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <!-- Bootstrap 5 JS CDN (모달 동작에 필요) -->
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>
    <!-- 커스텀 스타일 (LOL 테마) -->
    <link rel="stylesheet" href="css/main.css">
</head>
<body>

    <!-- ===== 네비게이션 바 ===== -->
    <nav class="navbar navbar-expand-lg bg-dark border-bottom border-body" data-bs-theme="dark">

        <!-- 로고 + 다크/라이트 모드 토글 버튼 -->
        <div class="navbar-brand d-flex align-items-center">
            <img src="../image/logo.png" alt="logo" width="30" height="30" class="me-2">
            <button type="button"
                class="btn border-0 text-light p-0 fs-5"
                id="themeToggleBtn">
            DARK
            </button>
        </div>

        <!-- 모바일 화면에서 네비바 접기/펼치기 버튼 -->
        <button class="navbar-toggler" type="button" data-bs-toggle="collapse" data-bs-target="#navbarSupportedContent"
            aria-controls="navbarSupportedContent" aria-expanded="false" aria-label="Toggle navigation">
            <span class="navbar-toggler-icon"></span>
        </button>

        <div class="collapse navbar-collapse" id="navbarSupportedContent">

            <!-- 네비바 메뉴 (가운데 정렬) -->
            <ul class="navbar-nav mx-auto mb-2 mb-lg-0">
                <li class="nav-item">
                    <a class="nav-link active" aria-current="page" href="/">메인화면</a>
                </li>
                <li class="nav-item">
                    <a class="nav-link" href="#">뉴스</a>
                </li>
                <li class="nav-item">
                    <a class="nav-link" href="#">챔피언</a>
                </li>
                <li class="nav-item">
                    <a class="nav-link" href="/main_page_sub/download.html">다운로드</a>
                </li>
                <li class="nav-item">
                    <a class="nav-link" href="/login">로그인</a>
                </li>
                <!-- 외부 사이트 드롭다운 -->
                <li class="nav-item dropdown">
                    <a class="nav-link dropdown-toggle" href="#" role="button" data-bs-toggle="dropdown" aria-expanded="false">
                        외부웹사이트
                    </a>
                    <ul class="dropdown-menu">
                        <li><a class="dropdown-item" href="https://www.leagueoflegends.com/ko-kr/" target="_blank">LOL공식웹사이트</a></li>
                    </ul>
                </li>
            </ul>

            <!-- 검색 폼 -->
            <form class="d-flex" id="searchForm">
                <input class="form-control me-2" type="search" placeholder="챔피언, 뉴스 검색..." aria-label="Search" id="searchInput">
                <button class="btn btn-outline-success" type="submit">검색하기</button>
            </form>

        </div>
    </nav>


    <!-- ===== 회원가입 폼 섹션 ===== -->
    <section class="hero d-flex align-items-center justify-content-center text-center py-5">
        <div class="container" style="max-width: 480px;">
            <h2 class="fw-bold mb-4">회원가입</h2>

            <!-- POST /register_check 로 가입 정보 전송 -->
            <form id="registerForm" action="/register_check" method="post">

                <!-- 아이디 입력 필드 -->
                <div class="mb-3 text-start">
                    <label class="form-label">아이디 *</label>
                    <input type="text" class="form-control"
                        id="username" name="username"
                        placeholder="4~20자 영문/숫자" required>
                    <div class="invalid-feedback" id="usernameMsg"></div>
                </div>

                <!-- 패스워드 입력 필드 (실제 입력용, 서버 전송 안 됨) -->
                <div class="mb-3 text-start">
                    <label class="form-label">패스워드 *</label>
                    <input type="password" class="form-control"
                        id="password"
                        placeholder="8자 이상, 영문+숫자+특수문자" required>
                </div>

                <!-- 패스워드 확인 입력 필드 -->
                <div class="mb-3 text-start">
                    <label class="form-label">패스워드 확인 *</label>
                    <input type="password" class="form-control"
                        id="passwordConfirm"
                        placeholder="패스워드 재입력" required>
                    <div class="invalid-feedback" id="passwordMsg"></div>
                </div>

                <!-- 이메일 입력 필드 -->
                <div class="mb-3 text-start">
                    <label class="form-label">이메일 *</label>
                    <input type="email" class="form-control"
                        id="email" name="email"
                        placeholder="example@email.com" required>
                    <div class="invalid-feedback" id="emailMsg"></div>
                </div>

                <!-- 연락처 입력 필드 -->
                <div class="mb-3 text-start">
                    <label class="form-label">연락처 *</label>
                    <input type="text" class="form-control"
                        id="phone" name="phone"
                        placeholder="010-0000-0000" required>
                    <div class="invalid-feedback" id="phoneMsg"></div>
                </div>

                <!-- SHA-256 해시된 패스워드를 담아 서버로 전송하는 hidden input -->
                <input type="hidden" id="hashedPassword" name="password">

                <!-- 클릭 시 유효성 검사 후 가입 확인 모달 표시 -->
                <button type="button" class="btn btn-primary w-100"
                    onclick="validateAndShowModal()">
                    회원가입
                </button>

            </form>
        </div>
    </section>


    <!-- ===== 가입 확인 모달 ===== -->
    <!-- 유효성 검사 통과 후 최종 가입 정보를 확인하는 모달창 -->
    <div class="modal fade" id="confirmModal" tabindex="-1">
        <div class="modal-dialog modal-dialog-centered">
            <div class="modal-content bg-dark text-white border-secondary">

                <div class="modal-header border-secondary">
                    <h5 class="modal-title">가입 확인</h5>
                    <button type="button" class="btn-close btn-close-white" data-bs-dismiss="modal"></button>
                </div>

                <div class="modal-body">
                    <p>아래 정보로 가입하시겠습니까?</p>
                    <!-- JS로 동적으로 채워지는 가입 정보 확인 테이블 -->
                    <table class="table table-dark table-bordered">
                        <tr>
                            <th>아이디</th>
                            <td id="confirmUsername"></td>
                        </tr>
                        <tr>
                            <th>이메일</th>
                            <td id="confirmEmail"></td>
                        </tr>
                        <tr>
                            <th>연락처</th>
                            <td id="confirmPhone"></td>
                        </tr>
                        <tr>
                            <th>패스워드</th>
                            <td>******** (암호화 전송)</td>
                        </tr>
                    </table>
                </div>

                <div class="modal-footer border-secondary">
                    <button type="button" class="btn btn-secondary" data-bs-dismiss="modal">취소</button>
                    <!-- 최종 확인 후 SHA-256 해시 생성 + 폼 제출 -->
                    <button type="button" class="btn btn-primary" onclick="submitRegister()">가입하기</button>
                </div>

            </div>
        </div>
    </div>

    <!-- ===== Toast 알림 컨테이너 (화면 우측 하단 고정) ===== -->
    <div class="toast-container position-fixed bottom-0 end-0 p-3" style="z-index:9999">
        <div id="liveToast" class="toast align-items-center text-white bg-success border-0" role="alert">
            <div class="d-flex">
                <div class="toast-body" id="toastBody">메시지</div>
                <button type="button" class="btn-close btn-close-white me-2 m-auto" data-bs-dismiss="toast"></button>
            </div>
        </div>
    </div>

    <!-- ===== JS 파일 로드 ===== -->
    <script src="../js/input_check.js"></script>   <!-- 유효성 검사 함수 (showError, clearError) -->
    <script src="../js/input_sha256.js"></script>  <!-- SHA-256 해시 함수 + 모달 표시 + 폼 제출 -->
    <script src="../js/test.js"></script>     <!-- Toast 함수 -->
    <script>
        // 회원가입 페이지 로딩 완료 시 Toast 알림 표시
        window.onload = function() {
            showToast('회원가입 페이지 로딩 완료');
        }
    </script>

</body>
</html>
