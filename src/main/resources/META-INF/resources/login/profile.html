<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>League of Legends - 내 프로필</title>

    <!-- Bootstrap 5 CSS CDN -->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <!-- Bootstrap 5 JS CDN (툴팁, 드롭다운 등 동작에 필요) -->
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>
    <!-- 커스텀 스타일 (LOL 테마) -->
    <link rel="stylesheet" href="css/main.css">
</head>
<body>

    <!-- ===== 네비게이션 바 ===== -->
    <nav class="navbar navbar-expand-lg bg-dark border-bottom border-body" data-bs-theme="dark">

        <!-- 로고 + 다크/라이트 모드 토글 버튼 -->
        <div class="navbar-brand d-flex align-items-center">
            <img src="../image/logo.png" alt="logo" width="30" height="30" class="me-2">
            <button type="button"
                class="btn border-0 text-light p-0 fs-5"
                id="themeToggleBtn">
            DARK
            </button>
        </div>

        <!-- 모바일 화면에서 네비바 접기/펼치기 버튼 -->
        <button class="navbar-toggler" type="button" data-bs-toggle="collapse" data-bs-target="#navbarSupportedContent"
            aria-controls="navbarSupportedContent" aria-expanded="false" aria-label="Toggle navigation">
            <span class="navbar-toggler-icon"></span>
        </button>

        <div class="collapse navbar-collapse" id="navbarSupportedContent">

            <!-- 네비바 메뉴 (가운데 정렬) -->
            <ul class="navbar-nav mx-auto mb-2 mb-lg-0">
                <li class="nav-item">
                    <a class="nav-link active" aria-current="page" href="/">메인화면</a>
                </li>
                <li class="nav-item">
                    <a class="nav-link" href="#">뉴스</a>
                </li>
                <li class="nav-item">
                    <a class="nav-link" href="#">챔피언</a>
                </li>
                <li class="nav-item">
                    <a class="nav-link" href="/main_page_sub/download.html">다운로드</a>
                </li>
                <!-- 프로필 버튼 -->
                <li class="nav-item">
                    <a class="nav-link" href="/profile">👤 프로필</a>
                </li>
                <!-- 로그아웃 버튼 -->
                <li class="nav-item">
                    <a class="nav-link btn btn-outline-danger btn-sm px-3"
                        href="/logout">로그아웃</a>
                </li>
                <!-- 외부 사이트 드롭다운 -->
                <li class="nav-item dropdown">
                    <a class="nav-link dropdown-toggle" href="#" role="button" data-bs-toggle="dropdown" aria-expanded="false">
                        외부웹사이트
                    </a>
                    <ul class="dropdown-menu">
                        <li><a class="dropdown-item" href="https://www.leagueoflegends.com/ko-kr/" target="_blank">LOL공식웹사이트</a></li>
                    </ul>
                </li>
            </ul>

            <!-- 검색 폼 -->
            <form class="d-flex" id="searchForm">
                <input class="form-control me-2" type="search" placeholder="챔피언, 뉴스 검색..." aria-label="Search" id="searchInput">
                <button class="btn btn-outline-success" type="submit">검색하기</button>
            </form>

        </div>
    </nav>


    <!-- ===== 프로필 섹션 ===== -->
    <section class="hero d-flex align-items-center justify-content-center text-center py-5">
        <div class="container" style="max-width: 500px;">
            <h2 class="fw-bold mb-4">👤 내 프로필</h2>

            <!-- 프로필 사진 영역 (기본 이미지: default.png, JS로 교체됨) -->
            <div class="mb-4">
                <img id="profileImg"
                    src="/uploads/profile/default.png"
                    class="rounded-circle"
                    width="120" height="120"
                    style="object-fit:cover; border:3px solid #fff;"
                    alt="프로필 사진">
            </div>

            <!-- 개인 정보 출력 (JS로 fetch해서 동적으로 채워짐) -->
            <div class="card bg-dark text-white border-secondary mb-4">
                <div class="card-body text-start">
                    <table class="table table-dark table-bordered mb-0">
                        <tr>
                            <th style="width:30%">아이디</th>
                            <td id="infoUsername"></td>
                        </tr>
                        <tr>
                            <th>이메일</th>
                            <td id="infoEmail"></td>
                        </tr>
                        <tr>
                            <th>연락처</th>
                            <td id="infoPhone"></td>
                        </tr>
                    </table>
                </div>
            </div>

            <!-- 프로필 사진 업로드 폼 (POST /profile/upload, multipart로 파일 전송) -->
            <form id="uploadForm"
                method="POST"
                action="/profile/upload"
                enctype="multipart/form-data">

                <!-- 오류 메시지 출력 영역 (업로드 실패 시 표시) -->
                <div id="uploadErrorMsg" class="alert alert-danger d-none mb-3"></div>

                <div class="mb-3">
                    <label class="form-label">프로필 사진 변경</label>
                    <!-- 허용 확장자: jpg, png, gif, webp -->
                    <input type="file"
                        class="form-control"
                        id="profileFile"
                        name="profileImage"
                        accept="image/jpeg,image/png,image/gif,image/webp">
                    <div class="form-text text-muted">
                        jpg, png, gif, webp / 최대 5MB
                    </div>
                </div>
                <button type="submit" class="btn btn-primary w-100">사진 업로드</button>
            </form>

        </div>
    </section>


    <!-- ===== JS 파일 로드 ===== -->
    <script src="../js/search.js"></script>    <!-- 검색 기능 -->
    <script src="../js/toggle.js"></script>    <!-- 다크/라이트 모드 토글 -->
    <script src="../js/profile.js"></script>   <!-- 사용자 정보 fetch + 화면 출력 -->

</body>
</html>
