<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>League of Legends - 내 프로필</title>

    <!-- Bootstrap 5 CSS CDN -->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <!-- Bootstrap 5 JS CDN (툴팁, 드롭다운 등 동작에 필요) -->
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>
    <!-- 커스텀 스타일 (LOL 테마) -->
    <link rel="stylesheet" href="css/main.css">
</head>
<body>

    <!-- ===== 네비게이션 바 ===== -->
    <nav class="navbar navbar-expand-lg bg-dark border-bottom border-body" data-bs-theme="dark">

        <!-- 로고 + 다크/라이트 모드 토글 버튼 -->
        <div class="navbar-brand d-flex align-items-center">
            <img src="../image/logo.png" alt="logo" width="30" height="30" class="me-2">
            <button type="button"
                class="btn border-0 text-light p-0 fs-5"
                id="themeToggleBtn">
            DARK
            </button>
        </div>

        <!-- 모바일 화면에서 네비바 접기/펼치기 버튼 -->
        <button class="navbar-toggler" type="button" data-bs-toggle="collapse" data-bs-target="#navbarSupportedContent"
            aria-controls="navbarSupportedContent" aria-expanded="false" aria-label="Toggle navigation">
            <span class="navbar-toggler-icon"></span>
        </button>

        <div class="collapse navbar-collapse" id="navbarSupportedContent">

            <!-- 네비바 메뉴 (가운데 정렬) -->
            <ul class="navbar-nav mx-auto mb-2 mb-lg-0">
                <li class="nav-item">
                    <a class="nav-link active" aria-current="page" href="/">메인화면</a>
                </li>
                <li class="nav-item">
                    <a class="nav-link" href="#">뉴스</a>
                </li>
                <li class="nav-item">
                    <a class="nav-link" href="#">챔피언</a>
                </li>
                <li class="nav-item">
                    <a class="nav-link" href="/main_page_sub/download.html">다운로드</a>
                </li>
                <!-- 프로필 버튼 -->
                <li class="nav-item">
                    <a class="nav-link" href="/profile">👤 프로필</a>
                </li>
                <!-- 로그아웃 버튼 -->
                <li class="nav-item">
                    <a class="nav-link btn btn-outline-danger btn-sm px-3"
                        href="/logout">로그아웃</a>
                </li>
                <!-- 외부 사이트 드롭다운 -->
                <li class="nav-item dropdown">
                    <a class="nav-link dropdown-toggle" href="#" role="button" data-bs-toggle="dropdown" aria-expanded="false">
                        외부웹사이트
                    </a>
                    <ul class="dropdown-menu">
                        <li><a class="dropdown-item" href="https://www.leagueoflegends.com/ko-kr/" target="_blank">LOL공식웹사이트</a></li>
                    </ul>
                </li>
            </ul>

            <!-- 검색 폼 -->
            <form class="d-flex" id="searchForm">
                <input class="form-control me-2" type="search" placeholder="챔피언, 뉴스 검색..." aria-label="Search" id="searchInput">
                <button class="btn btn-outline-success" type="submit">검색하기</button>
            </form>

        </div>
    </nav>


    <!-- ===== 프로필 섹션 ===== -->
    <section class="hero d-flex align-items-center justify-content-center text-center py-5">
        <div class="container" style="max-width: 500px;">
            <h2 class="fw-bold mb-4">👤 내 프로필</h2>

            <!-- 프로필 사진 영역 (기본 이미지: default.png, JS로 교체됨) -->
            <div class="mb-4">
                <img id="profileImg"
                    src="/uploads/profile/default.png"
                    class="rounded-circle"
                    width="120" height="120"
                    style="object-fit:cover; border:3px solid #fff;"
                    alt="프로필 사진">
            </div>

            <!-- 개인 정보 출력 (JS로 fetch해서 동적으로 채워짐) -->
            <div class="card bg-dark text-white border-secondary mb-4">
                <div class="card-body text-start">
                    <table class="table table-dark table-bordered mb-0">
                        <tr>
                            <th style="width:30%">아이디</th>
                            <td id="infoUsername"></td>
                        </tr>
                        <tr>
                            <th>이메일</th>
                            <td id="infoEmail"></td>
                        </tr>
                        <tr>
                            <th>연락처</th>
                            <td id="infoPhone"></td>
                        </tr>
                    </table>
                </div>
            </div>

            <!-- 프로필 사진 업로드 폼 (POST /profile/upload, multipart로 파일 전송) -->
            <form id="uploadForm"
                method="POST"
                action="/profile/upload"
                enctype="multipart/form-data">

                <!-- 오류 메시지 출력 영역 (업로드 실패 시 표시) -->
                <div id="uploadErrorMsg" class="alert alert-danger d-none mb-3"></div>

                <div class="mb-3">
                    <label class="form-label">프로필 사진 변경</label>
                    <!-- 허용 확장자: jpg, png, gif, webp -->
                    <input type="file"
                        class="form-control"
                        id="profileFile"
                        name="profileImage"
                        accept="image/jpeg,image/png,image/gif,image/webp">
                    <div class="form-text text-muted">
                        jpg, png, gif, webp / 최대 5MB
                    </div>
                </div>
                <button type="submit" class="btn btn-primary w-100">사진 업로드</button>
            </form>

            <!-- ===== 회원정보 수정 폼 ===== -->
            <hr class="my-4">

            <!-- 개인정보 수정 토글 버튼 (클릭 시 폼 펼침/접힘) -->
            <button class="btn btn-warning w-100 mb-2"
                type="button"
                data-bs-toggle="collapse"
                data-bs-target="#updateFormArea"
                aria-expanded="false">
                📝개인정보 수정
            </button>

            <!-- 기본 숨김 → 버튼 클릭 시 펼쳐짐 -->
            <div class="collapse" id="updateFormArea">
                <div class="card card-body bg-dark text-white border-secondary mt-2">

                    <!-- 수정 결과 메시지 (성공/실패 시 표시) -->
                    <div id="updateMsg" class="alert d-none mb-3"></div>

                    <!-- POST /profile/update 로 이메일 + 연락처 전송 -->
                    <form id="updateForm" method="POST" action="/profile/update">

                        <!-- 이메일 입력 필드 -->
                        <div class="mb-3 text-start">
                            <label class="form-label">이메일</label>
                            <input type="text" class="form-control"
                                id="updateEmail" name="email"
                                placeholder="example@email.com">
                            <div class="invalid-feedback" id="updateEmailMsg"></div>
                        </div>

                        <!-- 연락처 입력 필드 -->
                        <div class="mb-3 text-start">
                            <label class="form-label">연락처</label>
                            <input type="text" class="form-control"
                                id="updatePhone" name="phone"
                                placeholder="010-0000-0000">
                            <div class="invalid-feedback" id="updatePhoneMsg"></div>
                        </div>

                        <!-- 클릭 시 유효성 검사 후 폼 제출 -->
                        <button type="button"
                            class="btn btn-warning w-100"
                            onclick="validateAndUpdate()">
                            수정 완료
                        </button>
                    </form>

                    <!-- ===== 비밀번호 변경 폼 ===== -->
                    <hr class="my-4">
                    <h5 class="fw-bold mb-3">🔒 비밀번호 변경</h5>

                    <!-- 결과 메시지 -->
                    <div id="pwMsg" class="alert d-none mb-3"></div>

                    <!-- POST /profile/password 로 해시된 현재/새 비밀번호 전송 -->
                    <form id="pwForm" method="POST" action="/profile/password">

                        <!-- 현재 비밀번호 입력 (서버 전송 안 됨) -->
                        <div class="mb-3 text-start">
                            <label class="form-label">현재 비밀번호</label>
                            <input type="password" class="form-control"
                                id="currentPwInput"
                                placeholder="현재 비밀번호 입력" required>
                            <div class="invalid-feedback" id="currentPwMsg"></div>
                            <!-- SHA-256 해시값 전송용 hidden -->
                            <input type="hidden" id="currentPassword" name="currentPassword">
                        </div>

                        <!-- 새 비밀번호 입력 (서버 전송 안 됨) -->
                        <div class="mb-3 text-start">
                            <label class="form-label">새 비밀번호</label>
                            <input type="password" class="form-control"
                                id="newPwInput"
                                placeholder="8자 이상, 영문+숫자+특수문자" required>
                            <div class="invalid-feedback" id="newPwMsg"></div>
                            <!-- SHA-256 해시값 전송용 hidden -->
                            <input type="hidden" id="newPassword" name="newPassword">
                        </div>

                        <!-- 새 비밀번호 확인 -->
                        <div class="mb-3 text-start">
                            <label class="form-label">새 비밀번호 확인</label>
                            <input type="password" class="form-control"
                                id="newPwConfirm"
                                placeholder="새 비밀번호 재입력" required>
                            <div class="invalid-feedback" id="newPwConfirmMsg"></div>
                        </div>

                        <!-- 클릭 시 유효성 검사 + 해시 후 폼 제출 -->
                        <button type="button"
                            class="btn btn-danger w-100"
                            onclick="validateAndChangePassword()">
                            비밀번호 변경
                        </button>
                    </form>
                </div>
            </div>
        </div>
    </section>
    
    <!-- ===== Toast 알림 컨테이너 (화면 우측 하단 고정) ===== -->
    <div class="toast-container position-fixed bottom-0 end-0 p-3" style="z-index:9999">
        <div id="liveToast" class="toast align-items-center text-white bg-success border-0" role="alert">
            <div class="d-flex">
                <div class="toast-body" id="toastBody">메시지</div>
                <button type="button" class="btn-close btn-close-white me-2 m-auto" data-bs-dismiss="toast"></button>
            </div>
        </div>
    </div>

    <!-- ===== JS 파일 로드 ===== -->
    <script src="../js/search.js"></script>        <!-- 검색 기능 -->
    <script src="../js/toggle.js"></script>        <!-- 다크/라이트 모드 토글 -->
    <script src="../js/test.js"></script>          <!-- Toast 함수 -->
    <script src="../js/input_sha256.js"></script>  <!-- SHA-256 해시 함수 -->
    <script src="../js/profile.js"></script>       <!-- 사용자 정보 fetch + 화면 출력 -->

</body>
</html>
