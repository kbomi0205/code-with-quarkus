<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>League of Legends - 로그인</title>

    <!-- Bootstrap 5 CSS CDN -->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <!-- Bootstrap 5 JS CDN -->
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>
    <!-- 커스텀 스타일 (LOL 테마) -->
    <link rel="stylesheet" href="css/main.css">
</head>
<body>

    <!-- ===== 네비게이션 바 ===== -->
    <nav class="navbar navbar-expand-lg bg-dark border-bottom border-body" data-bs-theme="dark">

        <!-- 로고 + 다크/라이트 모드 토글 버튼 -->
        <div class="navbar-brand d-flex align-items-center">
            <img src="../image/logo.png" alt="logo" width="30" height="30" class="me-2">
            <button type="button"
                class="btn border-0 text-light p-0 fs-5"
                id="themeToggleBtn">
            DARK
            </button>
        </div>

        <!-- 모바일 화면에서 네비바 접기/펼치기 버튼 -->
        <button class="navbar-toggler" type="button" data-bs-toggle="collapse" data-bs-target="#navbarSupportedContent"
            aria-controls="navbarSupportedContent" aria-expanded="false" aria-label="Toggle navigation">
            <span class="navbar-toggler-icon"></span>
        </button>

        <div class="collapse navbar-collapse" id="navbarSupportedContent">

            <!-- 네비바 메뉴 (가운데 정렬) -->
            <ul class="navbar-nav mx-auto mb-2 mb-lg-0">
                <li class="nav-item">
                    <a class="nav-link active" aria-current="page" href="/">메인화면</a>
                </li>
                <li class="nav-item">
                    <a class="nav-link" href="#">뉴스</a>
                </li>
                <li class="nav-item">
                    <a class="nav-link" href="#">챔피언</a>
                </li>
                <li class="nav-item">
                    <a class="nav-link" href="/main_page_sub/download.html">다운로드</a>
                </li>
                <li class="nav-item">
                    <a class="nav-link" href="/login">로그인</a>
                </li>
                <!-- 외부 사이트 드롭다운 -->
                <li class="nav-item dropdown">
                    <a class="nav-link dropdown-toggle" href="#" role="button" data-bs-toggle="dropdown" aria-expanded="false">
                        외부웹사이트
                    </a>
                    <ul class="dropdown-menu">
                        <li><a class="dropdown-item" href="https://www.leagueoflegends.com/ko-kr/" target="_blank">LOL공식웹사이트</a></li>
                    </ul>
                </li>
            </ul>

            <!-- 검색 폼 -->
            <form class="d-flex" id="searchForm">
                <input class="form-control me-2" type="search" placeholder="챔피언, 뉴스 검색..." aria-label="Search" id="searchInput">
                <button class="btn btn-outline-success" type="submit">검색하기</button>
            </form>

        </div>
    </nav>


    <!-- ===== 로그인 폼 섹션 ===== -->
    <section class="hero d-flex align-items-center justify-content-center text-center py-5">
        <div class="container" style="max-width: 400px;">
            <h2 class="fw-bold mb-4">로그인</h2>

            <!-- POST /login_check 로 아이디 + 해시된 패스워드 전송 -->
            <form method="POST" action="/login_check" id="loginForm">

                <!-- 아이디 입력 필드 -->
                <div class="mb-3 text-start">
                    <label class="form-label">아이디</label>
                    <input type="text" class="form-control"
                        id="usernameInput" name="username" placeholder="4~20자 영문/숫자" required>
                    <div class="invalid-feedback" id="usernameInputMsg"></div>
                </div>

                <!-- 패스워드 입력 필드 (실제 입력용) -->
                <!-- hidden input에 SHA-256 해시값을 담아 서버로 전송 -->
                <div class="mb-3 text-start">
                    <label class="form-label">패스워드</label>
                    <input type="password" class="form-control"
                        id="passwordInput" placeholder="8자 이상, 영문+숫자+특수문자" required>
                    <div class="invalid-feedback" id="passwordInputMsg"></div>
                    <input type="hidden" id="password" name="password">
                </div>

                <!-- 로그인 버튼: 클릭 시 유효성 검사 + 해시 후 폼 제출 -->
                <button type="button" onclick="validateAndLogin()"
                    class="btn btn-primary w-100">로그인</button>

                <hr>

                <!-- 회원가입 페이지 이동 버튼 -->
                <a href="/register" class="btn btn-outline-secondary w-100">회원가입</a>

            </form>
        </div>
    </section>


    <!-- ===== JS 파일 로드 ===== -->
    <script src="../js/input_check.js"></script>   <!-- 유효성 검사 함수 (showError, clearError) -->
    <script src="../js/input_sha256.js"></script>  <!-- SHA-256 해시 함수 (hashPassword) -->
    <script src="../js/login.js"></script>          <!-- 로그인 유효성 검사 + 폼 제출 (validateAndLogin) -->

</body>
</html>
